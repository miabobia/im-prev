# file selector formatting
max-files = 21
max-file-name-length = 75

# borders
image-border-width = 54
image-border-height = 24

selector-border-width = 85
selector-border-height = 10

# chafa system args
chafa-max-width = 50
chafa-max-height = 20
chafa-default-symbols = "braille"

# adding buffering for UX smoothness
file-view-buffer-size = 10

# size ratios
image-width-ratio = 0.4
image-height-ratio = 0.7

selector-width-ratio = 0.4
selector-height-ratio = 0.7

fullscreen-image-width-ratio = 0.8
fullscreen-image-height-ratio = 0.8




foreground-color = "#e6aade"
background-color = "#aad8e6"